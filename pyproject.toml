[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rangao"
version = "0.1.0"
description = "一篇论文进来，一篇公众号文章出去"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "cssutils>=2.7.0",
    "markdown>=3.5.0",
]

[project.scripts]
rangao = "rangao.pipeline:main"

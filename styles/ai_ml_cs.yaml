# Style: AI/ML/CS (人工智能/机器学习/计算机科学)
#
# For AI, ML, computer vision, NLP, systems, and theory papers.
# Code-aware, benchmark-conscious, reproducibility-minded.

name: "AI与计算机科学前沿"
language: zh-CN
figure_caption_format: "图{n}. {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    格式：`[方法/模型名]：[核心创新点]，在[任务/基准]上[实现/超越][性能指标]`  
    示例："SparseFormer：基于动态稀疏注意力的视觉Transformer，在ImageNet上以1/3计算量超越ViT-L"

  - **语气**  
    面向 AI/ML 研究者和工程师。强调可复现性和公平对比。避免 hype（不用"革命性""通用人工智能"等），用数据和消融实验说话。对方法的局限性保持诚实。

  - **人称**  
    **第三人称**："作者""该工作""本文"。允许使用被动语态。

  - **篇幅与结构**  
    中长篇（2000-3500字），五部分：
    1. **问题定义** — 当前方法的瓶颈是什么？为什么现有方案不行？
    2. **核心idea** — 一句话说清创新点，给出直觉解释
    3. **方法解析** — 架构/算法/损失函数的关键设计，为什么这样设计？
    4. **实验验证** — 主表 + 消融 + 可视化，每个数字说明意义
    5. **局限与展望** — 诚实写局限，给出未来方向

  - **技术呈现**  
    - 关键数字用粗体或单独标注（如"**Top-1 Acc 87.3%**"）
    - 必要时给伪代码风格的算法描述（简化为自然语言步骤）
    - 引用开源仓库链接（如有）
    - 提及训练成本（GPU hours）和推理延迟

  - **图文规则**  
    - 架构图优先（模型结构、数据流）
    - 实验结果表其次（主表 + 关键消融）
    - 可视化（attention map、t-SNE、failure cases）辅助理解
    - 每张图说明"这张图验证了什么假设"

  - **结尾要素**  
    - 总结：方法+关键结果+意义
    - 论文信息：标题、作者、会议/期刊、arXiv ID
    - 代码链接（如有）："🔗 代码：https://github.com/..."
    - 可选：与同期工作的关系

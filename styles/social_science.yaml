# Style: Social Science & Economics (社科/经济/心理学)
#
# For economics, psychology, sociology, political science, management.
# Emphasizes causal identification, study design, and real-world relevance.

name: "社会科学与经济解读"
language: zh-CN
figure_caption_format: "图{n}. {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    格式：`[研究问题]：[核心发现]，基于[数据/方法]的[因果推断/机制检验]`  
    示例："最低工资与就业：基于中国县级面板数据的因果推断，发现温和提标对就业无显著负面影响"

  - **语气**  
    面向经济学、社会科学研究者和政策关注者。强调因果识别策略和研究设计的可信度。结论需区分"相关"和"因果"。避免过度外推——说清研究的外部有效性边界。

  - **人称**  
    **第三人称**："作者""该研究"。社会科学的"我们"传统可适度保留。

  - **篇幅与结构**  
    中篇（1500-3000字），四部分：
    1. **研究动机** — 这个问题的政策/理论重要性、已有文献的矛盾或空白
    2. **研究设计** — 数据来源（样本量、时间跨度）、识别策略（DID/RDD/IV/RCT）、关键变量定义
    3. **主要发现** — 基准回归 → 稳健性检验 → 异质性 → 机制检验
    4. **讨论与启示** — 与已有文献的对话、政策含义、研究局限

  - **数据呈现**  
    - 关键系数：给出点估计 + 标准误 + 显著性标记
    - 效应量：用实际单位解释经济显著性（不只是统计显著性）
    - 稳健性：列出做了哪些检验（替换变量、改变样本、安慰剂…）
    - 异质性：哪些子群体/地区/时期效应不同？

  - **图文规则**  
    - 事件研究图/DID 动态效应图优先
    - 机制检验图其次
    - 描述性统计表/图辅助
    - 避免过度技术化的公式堆砌

  - **结尾要素**  
    - 总结：研究问题+方法+核心发现+政策含义
    - 论文信息：标题、作者、期刊、DOI
    - 数据与代码可用性（如有）

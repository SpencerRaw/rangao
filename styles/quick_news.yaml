# Style: Quick News (快讯简报)
#
# Short, punchy format for rapid publishing.
# Suitable for journal table-of-contents roundups or news aggregation.

name: "快讯简报"
language: zh-CN
figure_caption_format: "▲ {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    简洁有力，直接点明核心发现。控制在 25 字以内。  
    格式：`[机构/团队] [发现/实现] [核心亮点]`

  - **语气**  
    快讯风格——直接、精炼、要点驱动。每条信息都值得被快速扫描。不用长难句，多用短句。

  - **人称**  
    **第三人称**。可以提及通讯作者姓名和机构。

  - **篇幅与结构**  
    短篇（800-1500字），三段式：
    1. **What** (1段) — 他们做了什么？一句话说清
    2. **How & Why** (2-3段) — 怎么做的？为什么重要？关键数据一句话
    3. **So What** (1段) — 领域影响、下一步

  - **写作原则**  
    - 每段不超过 3 句话
    - 关键数字突出（如"效率提升 3.49 倍""循环寿命 >1200 小时"）
    - 不展开方法论细节，只给结论和意义
    - 可以加 emoji 分隔不同模块（可选）
    - 配 1-3 张关键图即可

  - **结尾要素**  
    - 一句话总结
    - 论文信息：标题、期刊、DOI
    - "🔗 原文链接：..." 

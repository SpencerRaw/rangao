# Style: Energy & Catalysis (能源/催化/环境)
#
# For electrocatalysis, photocatalysis, batteries, fuel cells, CO2 reduction.
# Number-heavy, performance-benchmark-conscious.

name: "能源与催化前沿"
language: zh-CN
figure_caption_format: "图{n}. {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    格式：`[催化剂/材料]：[设计策略]，实现[性能指标]的[反应类型]，[揭示][活性来源/反应机制]`  
    示例："Fe-N₅/CNT单原子催化剂：轴向配位工程调控自旋态，实现工业级电流密度CO₂电还原，法拉第效率>95%"

  - **语气**  
    面向催化、能源材料领域的研究者和工程师。数据驱动——每个结论必须有数字支撑。允许正面评价（"显著提升""超越基准"），但必须给出对比基准。

  - **人称**  
    **第三人称**："研究团队""该工作"。

  - **篇幅与结构**  
    中长篇（2500-4000字），四部分：
    1. **反应瓶颈** — 该催化反应的挑战（过电位、选择性、稳定性），现有催化剂局限
    2. **设计策略** — 催化剂的理性设计思路、合成方法、结构特征
    3. **性能与机理** — 电化学/光催化性能数据 → 原位表征 → 理论计算 → 构效关系
    4. **器件与应用** — 在器件层面的表现（燃料电池、电解槽等）、稳定性、放大潜力

  - **数据呈现**  
    - 电化学：过电位、Tafel斜率、法拉第效率、电流密度、TOF
    - 稳定性：计时电流/计时电位时长、循环次数
    - 对比：必须给出与文献基准催化剂（如Pt/C、IrO₂）的对比
    - 原位表征：XAFS的键长/配位数、ATR-SEIRAS的峰位归属
    - DFT：d带中心、吸附能、反应能垒、速率控制步骤

  - **图文规则**  
    - 合成示意图优先（展示设计思路）
    - 性能对比图其次（LSV、FE、稳定性）
    - 原位表征+DFT图证明机理
    - 器件性能图收尾

  - **结尾要素**  
    - 总结：设计策略+性能突破+机理认知
    - 论文信息：标题、作者、期刊、DOI
    - 可选：实用化前景评估

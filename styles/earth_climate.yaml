# Style: Earth & Climate (地学/气候/生态)
#
# For climate science, geology, oceanography, ecology, atmospheric science.
# Emphasizes system-level thinking and real-world implications.

name: "地球科学与气候变化"
language: zh-CN
figure_caption_format: "图{n}. {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    格式：`[研究区域/系统]：[核心发现]，[揭示/约束/预测][关键过程或未来趋势]`  
    示例："青藏高原多年冻土区：加速融化的热喀斯特地貌，揭示碳释放对全球气候的正反馈强度"

  - **语气**  
    面向地学、气候、生态领域研究者和政策关注者。强调时空尺度和不确定性量化。数据解读需区分"观测事实"和"模型推断"。可适度强调社会意义，但不过度。

  - **人称**  
    **第三人称**："研究团队""作者"。

  - **篇幅与结构**  
    中长篇（2000-3500字），四部分：
    1. **科学问题** — 为什么这个区域/过程重要？已有认知的缺口在哪里？
    2. **方法与数据** — 使用了什么数据（卫星/台站/冰芯/模式）？方法创新在哪？
    3. **关键发现** — 证据链条：观测→分析→归因→机制
    4. **启示与展望** — 对理解地球系统的影响、政策含义、不确定性、下一步

  - **数据呈现**  
    - 趋势数据：给出变化速率和统计显著性（p值、置信区间）
    - 空间数据：说明空间分辨率和覆盖范围
    - 模式结果：明确是预报/预测/预估，给出集合 spread
    - 极端事件：给出重现期或概率
    - 不确定性：必须诚实说明

  - **图文规则**  
    - 空间分布图优先（地图、遥感影像）
    - 时间序列图其次（长期趋势、年际变率）
    - 机制示意图辅助理解
    - 每张图标注时空范围

  - **结尾要素**  
    - 总结：核心发现+机制+意义
    - 论文信息：标题、作者、期刊、DOI
    - 数据可用性声明（如有）

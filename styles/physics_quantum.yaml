# Style: Physics & Quantum (物理/量子/凝聚态)
#
# For condensed matter physics, quantum materials, optics, and fundamental physics.
# Balances mathematical rigor with accessible explanation.

name: "物理与量子前沿"
language: zh-CN
figure_caption_format: "图{n}. {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    格式：`[物理体系]：[核心发现/效应]，[揭示/实现][物理机制或应用潜力]`  
    示例："转角双层石墨烯：关联绝缘态与超导态的量子相变，揭示莫尔超晶格中的强关联物理"

  - **语气**  
    面向凝聚态物理、量子材料领域的研究者和研究生。使用精确的物理术语，但关键概念需给出一句话物理图像解释。允许使用"揭示了""证实了""首次观测到"等正向判断，但避免过度宣传。

  - **人称**  
    **第三人称**："研究团队""该工作""作者"。物理类论文常用被动语态，可以保留。

  - **篇幅与结构**  
    中长篇（2500-4000字），四部分：
    1. **物理背景** — 该体系的核心物理问题、已有理论框架、未解决的矛盾
    2. **核心发现** — 实验观测/理论预测的核心结果，一句话点明物理意义
    3. **证据链条** — 按实验/计算逻辑展开：结构→谱学→输运→理论模型→机制图景
    4. **物理意义** — 对该领域理解的推进、与已有理论的对话、新问题

  - **术语处理**  
    - 首次出现的专业术语给出中英文："电荷密度波（CDW）""角分辨光电子能谱（ARPES）"
    - 关键物理量保留符号（如 Tc、EF、k·p）
    - 允许使用约定俗成的缩写（vdW、DFT、STM）

  - **数据呈现**  
    - 相图优先：用文字描述相图中的关键区域和边界
    - 谱学数据：说明峰位、线宽、色散的物理含义
    - 理论计算：简述方法（DFT+U、DMFT…），重点讲结果和物理图像

  - **图文规则**  
    - 相图/色散关系图优先解读
    - 结构表征图（STM、TEM）简略带过，重点讲与物理性质的关联
    - 每张图必须说明"为什么做这个测量"和"数据告诉我们什么"

  - **结尾要素**  
    - 总结：核心发现+物理机制图景
    - 论文信息：标题、作者、期刊、DOI
    - 可选：领域展望（"该发现为……开辟了新方向"）

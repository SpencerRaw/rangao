# Style: Academic General (通用学术科普)
#
# A versatile template for any scientific field.
# Clean, accessible, balances rigor with readability.

name: "通用学术科普"
language: zh-CN
figure_caption_format: "图{n}. {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    格式：`[一句话核心发现/技术亮点]`。标题应当精炼有力，让读者一眼知道这篇论文做了什么。控制在 30 字以内。

  - **语气**  
    面向科研人员和研究生，兼顾专业性和可读性。行文客观严谨，避免过度夸张（不用"革命性""颠覆性"），用数据和逻辑说话。

  - **人称**  
    全文使用**第三人称**："研究团队""该工作""作者"。禁止使用第一人称。

  - **篇幅与结构**  
    中篇解读（2000-4000字），由四部分组成：
    1. **研究背景** — 1-2段，领域背景+核心问题
    2. **核心突破** — 2-3段，本研究做了什么、怎么做的、关键发现
    3. **图文解读** — 按逻辑顺序展示关键图表，每张图配分析性解读
    4. **意义与展望** — 1段总结+未来方向

  - **术语处理**  
    首次出现缩写时给出全称，如"密度泛函理论（DFT）"。关键概念可保留英文。

  - **图文规则**  
    - 图片紧跟相关文字段落之后
    - 正文中用"（图X）"交叉引用
    - 图题简洁，正文不重复图题内容
    - 解读图片时要说明"看到什么→说明什么→推论什么"

  - **结尾要素**  
    - 总结段落
    - 论文信息：标题、作者、期刊、DOI
    - 可选的"延伸阅读"（1-2篇相关文献）

# Style: Biomedical Breakthrough (生物医学突破解读)
#
# Optimized for biomedical/clinical research papers.
# Emphasizes translational potential and clinical relevance.

name: "生物医学突破解读"
language: zh-CN
figure_caption_format: "图{n}. {description}"

images:
  header: "header.png"

prompt: |
  ### 风格指南

  - **标题**  
    格式：`[疾病/适应症]：[核心机制/靶点发现]，[实现/有望][临床转化前景]`  
    示例："三阴性乳腺癌：靶向肿瘤微环境的新型纳米递药系统，显著抑制肺转移"

  - **语气**  
    面向生物医学研究人员和临床医生。在严谨科学基础上，适度强调转化潜力和临床意义。避免夸大疗效，但可以正面评价创新性。

  - **人称**  
    全文**第三人称**："研究团队""课题组""该工作"。

  - **篇幅与结构**  
    中长篇（3000-5000字），由以下部分构成：
    1. **临床痛点** — 该疾病的未满足临床需求、现有治疗局限
    2. **研究亮点** — 一句话概括本研究解决了什么核心问题
    3. **机制解析** — 详细解读分子机制、信号通路、靶点验证
    4. **疗效验证** — 体外→体内→安全性，逐层递进
    5. **转化前景** — 临床转化潜力、与现有疗法对比、待解决问题

  - **数据呈现原则**  
    - 关键疗效数据用具体数字（如"肿瘤生长抑制率达 87.7%"）
    - 统计显著性标注（p 值、置信区间）
    - 安全性数据必提（主要器官毒性、体重变化等）
    - 与临床标准疗法做对比（如有）

  - **图文规则**  
    - 机制图优先解读（信号通路、作用模式）
    - 体内疗效图次之（肿瘤生长曲线、生存曲线、成像）
    - 表征图（TEM、Western blot）简略带过

  - **结尾要素**  
    - 总结：机制创新+疗效突破+转化价值
    - 论文信息（标题、作者、期刊、DOI）
    - 可选：评论（"该工作为……提供了新范式"）
